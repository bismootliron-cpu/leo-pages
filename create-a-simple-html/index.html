<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>test-status-fix</title>
  <style>
    body {
      background-color: #1a1a2e;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1 {
      color: #e0e0ff;
      font-size: 2.5rem;
      margin-bottom: 16px;
      text-align: center;
    }
    p {
      color: #c0c0e0;
      font-size: 1.2rem;
      text-align: center;
    }
    .badge {
      background-color: #16213e;
      border: 2px solid #4ade80;
      border-radius: 8px;
      padding: 32px 48px;
      text-align: center;
      box-shadow: 0 0 24px rgba(74, 222, 128, 0.2);
    }
    .status {
      color: #4ade80;
      font-size: 1rem;
      font-weight: bold;
      margin-top: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="badge">
    <h1>test-status-fix</h1>
    <p>System check — deployment pipeline working correctly. Run #3.</p>
    <div class="status">✅ STATUS: OK — Run #3</div>
  </div>
</body>
</html>
