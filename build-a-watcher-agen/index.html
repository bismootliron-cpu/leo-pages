<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watcher Agent — Signal Ingestion System</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #07070e;
  --surface: #0d0d1a;
  --surface2: #111122;
  --border: #1a1a30;
  --border2: #222240;
  --accent: #6c63ff;
  --cyan: #00e5cc;
  --amber: #ffb020;
  --danger: #ff4d6d;
  --green: #00d68f;
  --text: #e8e8f5;
  --text2: #b0b0cc;
  --muted: #5a5a7a;
  --card: #0f0f1e;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── ANIMATED BACKGROUND ── */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

.bg-glow {
  position: fixed;
  top: -200px;
  left: 50%;
  transform: translateX(-50%);
  width: 800px;
  height: 400px;
  background: radial-gradient(ellipse, rgba(108,99,255,0.08) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

.bg-glow2 {
  position: fixed;
  bottom: -100px;
  right: -100px;
  width: 500px;
  height: 500px;
  background: radial-gradient(ellipse, rgba(0,229,204,0.05) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

/* ── LAYOUT ── */
.wrapper {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 24px 80px;
}

/* ── HEADER ── */
.header {
  padding: 32px 0 28px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 36px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  flex-wrap: wrap;
}

.header-left { display: flex; flex-direction: column; gap: 6px; }

.brand-line {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--accent);
  background: rgba(108,99,255,0.1);
  border: 1px solid rgba(108,99,255,0.3);
  padding: 4px 10px;
  border-radius: 4px;
}

.header-title {
  font-size: 28px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.2;
}

.header-title span { color: var(--cyan); }

.header-sub {
  font-size: 13px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 4px;
}

.status-pill {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid rgba(0,214,143,0.3);
  background: rgba(0,214,143,0.08);
  font-size: 12px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--green);
  white-space: nowrap;
}

.dot-pulse {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--green);
  animation: dotpulse 2s infinite;
}

@keyframes dotpulse { 0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(0,214,143,0.4)} 50%{opacity:0.6;box-shadow:0 0 0 6px rgba(0,214,143,0)} }

/* ── GOAL BANNER ── */
.goal-banner {
  background: linear-gradient(135deg, rgba(108,99,255,0.1) 0%, rgba(0,229,204,0.06) 100%);
  border: 1px solid var(--border2);
  border-radius: 14px;
  padding: 20px 24px;
  margin-bottom: 36px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.goal-icon {
  font-size: 28px;
  flex-shrink: 0;
  margin-top: 2px;
}

.goal-content {}
.goal-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.goal-desc { font-size: 13px; color: var(--text2); line-height: 1.7; }
.goal-desc strong { color: var(--cyan); font-weight: 500; }

/* ── TASK CARDS ── */
.tasks-grid {
  display: flex;
  flex-direction: column;
  gap: 24px;
  margin-bottom: 36px;
}

.task-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  transition: border-color 0.2s;
}

.task-card:hover { border-color: var(--border2); }

.task-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.015);
  gap: 12px;
  flex-wrap: wrap;
}

.task-number {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--muted);
  background: var(--surface2);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 4px;
}

.task-title-wrap { display: flex; align-items: center; gap: 12px; flex: 1; }

.task-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.task-icon.purple { background: rgba(108,99,255,0.18); }
.task-icon.cyan { background: rgba(0,229,204,0.15); }
.task-icon.amber { background: rgba(255,176,32,0.15); }

.task-name { font-size: 16px; font-weight: 600; color: var(--text); }
.task-endpoint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--accent);
  margin-top: 2px;
}

.task-badge {
  font-size: 10px;
  padding: 4px 10px;
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.task-badge.post { background: rgba(0,214,143,0.12); color: var(--green); border: 1px solid rgba(0,214,143,0.25); }
.task-badge.sql { background: rgba(255,176,32,0.12); color: var(--amber); border: 1px solid rgba(255,176,32,0.25); }
.task-badge.cron { background: rgba(108,99,255,0.12); color: var(--accent); border: 1px solid rgba(108,99,255,0.25); }

.task-body { padding: 24px; display: flex; flex-direction: column; gap: 20px; }

/* Bullet list */
.spec-list { display: flex; flex-direction: column; gap: 8px; }

.spec-item {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  color: var(--text2);
  line-height: 1.6;
}

.spec-bullet {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);
  flex-shrink: 0;
  margin-top: 7px;
}

.spec-bullet.cyan { background: var(--cyan); }
.spec-bullet.amber { background: var(--amber); }

.spec-item strong { color: var(--text); font-weight: 500; }
.spec-item code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  background: rgba(108,99,255,0.12);
  color: var(--accent);
  padding: 1px 6px;
  border-radius: 4px;
}

/* ── CODE BLOCKS ── */
.code-block {
  background: #050510;
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.code-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,0.02);
}

.code-lang {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--muted);
  letter-spacing: 1px;
  text
