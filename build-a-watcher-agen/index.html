<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watcher-Agent Signal Logging System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #0a0e1a;
      color: #c9d1e0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 0 0 60px 0;
    }

    header {
      background: linear-gradient(135deg, #0d1b2e 0%, #112240 100%);
      border-bottom: 2px solid #1e3a5f;
      padding: 32px 40px;
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #0b2a4a;
      border: 1px solid #1e5080;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 12px;
      color: #4db8ff;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .header-badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #00e5ff;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #e8f0ff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    header p {
      color: #7a8ba8;
      font-size: 15px;
      max-width: 700px;
    }

    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    /* Status Grid */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

    .status-card {
      background: #0d1b2e;
      border: 1px solid #1e3a5f;
      border-radius: 12px;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .status-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }

    .status-icon.green { background: #0a2e1a; }
    .status-icon.blue { background: #0a1e3a; }
    .status-icon.orange { background: #2e1a0a; }

    .status-label {
      font-size: 12px;
      color: #5a6a80;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .status-value {
      font-size: 15px;
      font-weight: 600;
      color: #e0eaff;
    }

    .status-value.green { color: #2ddc7e; }
    .status-value.blue { color: #4db8ff; }
    .status-value.orange { color: #ff9a3c; }

    /* Sections */
    .section {
      background: #0d1b2e;
      border: 1px solid #1e3a5f;
      border-radius: 14px;
      margin-bottom: 28px;
      overflow: hidden;
    }

    .section-header {
      background: #0b1929;
      border-bottom: 1px solid #1e3a5f;
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-number {
      width: 28px;
      height: 28px;
      background: #1a3a6e;
      border: 1px solid #2a5aaa;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: #7ab4ff;
      flex-shrink: 0;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #dce8ff;
    }

    .section-subtitle {
      font-size: 13px;
      color: #5a6a80;
      margin-left: auto;
    }

    .section-body {
      padding: 28px;
    }

    /* Code blocks */
    .code-block {
      background: #060d18;
      border: 1px solid #152535;
      border-radius: 10px;
      padding: 20px 24px;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.7;
      overflow-x: auto;
      margin: 0;
      position: relative;
    }

    .code-block .line { display: block; }
    .code-block .kw { color: #c792ea; }
    .code-block .fn { color: #82aaff; }
    .code-block .str { color: #c3e88d; }
    .code-block .cm { color: #4a5e75; font-style: italic; }
    .code-block .num { color: #f78c6c; }
    .code-block .var { color: #89ddff; }
    .code-block .dec { color: #ffcb6b; }
    .code-block .op { color: #89ddff; }
    .code-block .sql-kw { color: #89ddff; }
    .code-block .sql-type { color: #ffcb6b; }
    .code-block .sql-fn { color: #c3e88d; }

    .code-label {
      font-size: 11px;
      font-weight: 700;
      color: #4a6080;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    /* Field table */
    .field-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 4px;
    }

    .field-table th {
      background: #09172a;
      color: #5a7a9a;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      padding: 10px 16px;
      text-align: left;
      border-bottom: 1px solid #1a3050;
    }

    .field-table td {
      padding: 12px 16px;
      font-size: 13px;
      color: #b0c4d8;
      border-bottom: 1px solid #111e30;
    }

    .field-table tr:last-child td {
      border-bottom: none;
    }

    .field-table tr:hover td {
      background: #0b1929;
    }

    .field-name {
      font-family: 'Consolas', monospace;
      color: #82aaff;
      font-weight: 600;
    }

    .field-type {
      font-family: 'Consolas', monospace;
      color: #ffcb6b;
      font-size: 12px;
    }

    .field-required {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }

    .req-yes {
      background: #0e2e1e;
      color: #2ddc7e;
      border: 1px solid #1a5a38;
    }

    .req-no {
      background: #1e1e0a;
      color: #aaa830;
      border: 1px solid #3a3a10;
    }

    /* Curl command */
    .curl-block {
      background: #060d18;
      border: 1px solid #1a3a1a;
      border-left: 3px solid #2ddc7e;
      border-radius: 10px;
      padding: 20px 24px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 13px;
      line-height: 1.8;
      overflow-x: auto;
      color: #c3e88d;
    }

    .curl-block .curl-cmd { color: #2ddc7e; font-weight: 700; }
    .curl-block .curl-flag { color: #89ddff; }
    .curl-block .curl-url { color: #ffcb6b; }
    .curl-block .curl-header { color: #c792ea; }
    .curl-block .curl-data { color: #c3e88d; }

    /* Info boxes */
    .info-box {
      border-radius: 10px;
      padding: 16px 20px;
      font-size: 13px;
      line-height: 1.6;
      margin-top: 20px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .info-box.blue {
      background: #081828;
      border: 1px solid #1a3a6e;
      color: #7ab4ff;
    }

    .info-box.green {
      background: #081a10;
      border: 1px solid #1a5a38;
      color: #5dd6a0;
    }

    .info-box.yellow {
      background: #1a1500;
      border: 1px solid #4a4000;
      color: #d4b84a;
    }

    .info-box-icon {
      font-size: 16px;
      margin-top: 1px;
      flex-shrink: 0;
    }

    /* Two column layout */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 20px;
    }

    /* Response block */
    .response-block {
      background: #060d18;
      border: 1px solid #1a3a1a;
      border-radius: 10px;
      padding: 16px 20px;
      font-family: 'Consolas', monospace;
