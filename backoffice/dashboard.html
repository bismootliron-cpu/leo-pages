* { margin: 0; padding: 0; box-sizing: border-box; }
  

  
:root {
  
  --bg: #08080f;
  
  --surface: #0e0e1a;
  
  --surface2: #12121f;
  
  --border: #1a1a2e;
  
  --accent: #6c63ff;
  
  --cyan: #00e5cc;
  
  --amber: #ffb020;
  
  --danger: #ff4d6d;
  
  --text: #e8e8f5;
  
  --muted: #5a5a7a;
  
  --card: #111120;
  
}
  

  
body {
  
  font-family: 'Space Grotesk', sans-serif;
  
  background: var(--bg);
  
  color: var(--text);
  
  height: 100vh;
  
  overflow: hidden;
  
  display: flex;
  
  flex-direction: column;
  
}
  

  
/* ── TOPBAR ── */
  
.topbar {
  
  display: flex;
  
  align-items: center;
  
  justify-content: space-between;
  
  padding: 0 24px;
  
  height: 52px;
  
  border-bottom: 1px solid var(--border);
  
  background: var(--surface);
  
  flex-shrink: 0;
  
  gap: 16px;
  
}
  

  
.brand {
  
  font-family: 'JetBrains Mono', monospace;
  
  font-size: 14px;
  
  font-weight: 500;
  
  letter-spacing: 4px;
  
  color: var(--accent);
  
  white-space: nowrap;
  
}
  

  
.brand span { color: var(--muted); font-weight: 300; }
  

  
.topbar-center {
  
  display: flex;
  
  align-items: center;
  
  gap: 6px;
  
  flex: 1;
  
  justify-content: center;
  
}
  

  
.nav-pill {
  
  padding: 5px 14px;
  
  border-radius: 20px;
  
  font-size: 12px;
  
  cursor: pointer;
  
  border: 1px solid transparent;
  
  color: var(--muted);
  
  transition: all 0.15s;
  
  white-space: nowrap;
  
}
  

  
.nav-pill:hover { color: var(--text); border-color: var(--border); }
  
.nav-pill.active { background: rgba(108,99,255,0.15); border-color: var(--accent); color: var(--accent); }
  

  
.topbar-right {
  
  display: flex;
  
  align-items: center;
  
  gap: 16px;
  
  white-space: nowrap;
  
}
  

  
.status-group {
  
  display: flex;
  
  align-items: center;
  
  gap: 6px;
  
}
  

  
.dot {
  
  width: 7px; height: 7px;
  
  border-radius: 50%;
  
}
  

  
.dot.online { background: var(--cyan); box-shadow: 0 0 8px var(--cyan); animation: pulse 2s infinite; }
  
.dot.offline { background: var(--danger); }
  
.dot.amber { background: var(--amber); }
  

  
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  

  
.clock {
  
  font-family: 'JetBrains Mono', monospace;
  
  font-size: 12px;
  
  color: var(--muted);
  
}
  

  
.settings-btn {
  
  width: 30px; height: 30px;
  
  border-radius: 8px;
  
  border: 1px solid var(--border);
  
  background: var(--card);
  
  color: var(--muted);
  
  cursor: pointer;
  
  display: flex;
  
  align-items: center;
  
  justify-content: center;
  
  font-size: 14px;
  
  transition: all 0.15s;
  
}
  

  
.settings-btn:hover { border-color: var(--accent); color: var(--accent); }
  

  
/* ── MAIN LAYOUT ── */
  
.main {
  
  display: grid;
  
  grid-template-columns: 240px 1fr 340px;
  
  flex: 1;
  
  overflow: hidden;
  
}
