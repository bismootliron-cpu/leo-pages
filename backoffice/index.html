<!DOCTYPE html>

<html lang="he" dir="rtl">
  
<head>
  
<meta charset="UTF-8">
  
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  
<title>Hermes OS — כניסה</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  
* { margin: 0; padding: 0; box-sizing: border-box; }
  

  
:root {
  
  --bg: #08080f;
  
  --surface: #0e0e1a;
  
  --border: #1a1a2e;
  
  --accent: #6c63ff;
  
  --cyan: #00e5cc;
  
  --amber: #ffb020;
  
  --text: #e8e8f5;
  
  --muted: #5a5a7a;
  
}
  

  
body {
  
  font-family: 'Space Grotesk', sans-serif;
  
  background: var(--bg);
  
  color: var(--text);
  
  min-height: 100vh;
  
  display: flex;
  
  align-items: center;
  
  justify-content: center;
  
  overflow: hidden;
  
}
  

  
canvas {
  
  position: fixed;
  
  inset: 0;
  
  pointer-events: none;
  
  opacity: 0.4;
  
}
  

  
.login-box {
  
  position: relative;
  
  z-index: 10;
  
  width: 380px;
  
  background: var(--surface);
  
  border: 1px solid var(--border);
  
  border-radius: 20px;
  
  padding: 48px 40px;
  
  box-shadow: 0 0 80px rgba(108, 99, 255, 0.12);
  
}
  

  
.brand {
  
  text-align: center;
  
  margin-bottom: 40px;
  
}
  

  
.brand-name {
  
  font-family: 'JetBrains Mono', monospace;
  
  font-size: 28px;
  
  font-weight: 500;
  
  letter-spacing: 6px;
  
  color: var(--accent);
  
  margin-bottom: 6px;
  
}
  

  
.brand-sub {
  
  font-size: 12px;
  
  color: var(--muted);
  
  letter-spacing: 2px;
  
  text-transform: uppercase;
  
  font-family: 'JetBrains Mono', monospace;
  
}
  

  
.node-ring {
  
  width: 64px;
  
  height: 64px;
  
  border-radius: 50%;
  
  border: 2px solid var(--accent);
  
  display: flex;
  
  align-items: center;
  
  justify-content: center;
  
  margin: 0 auto 20px;
  
  position: relative;
  
  animation: spin 8s linear infinite;
  
}
  

  
.node-ring::before {
  
  content: '';
  
  position: absolute;
  
  width: 48px;
  
  height: 48px;
  
  border-radius: 50%;
  
  border: 1px solid rgba(0, 229, 204, 0.4);
  
  animation: spin 4s linear infinite reverse;
  
}
  

  
.node-ring::after {
  
  content: '⬡';
  
  font-size: 24px;
  
  color: var(--cyan);
  
  animation: spin 8s linear infinite reverse;
  
}
  

  
@keyframes spin {
  
  to { transform: rotate(360deg); }
  
}
  

  
.field {
  
  margin-bottom: 16px;
  
}
  

  
.field label {
  
  display: block;
  
  font-size: 11px;
  
  color: var(--muted);
  
  letter-spacing: 1px;
  
  text-transform: uppercase;
  
  font-family: 'JetBrains Mono', monospace;
  
  margin-bottom: 8px;
  
}
  

  
.field input {
  
  width: 100%;
  
  background: var(--bg);
  
  border: 1px solid var(--border);
  
  border-radius: 10px;
  
  padding: 14px 16px;
  
  color: var(--text);
  
  font-size: 15px;
  
  font-family: 'JetBrains Mono', monospace;
  
  outline: none;
  
  transition: border-color 0.2s;
  
}
  

  
.field input:focus {
  
  border-color: var(--accent);
  
  box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.1);
  
}
  

  
.btn {
  
  width: 100%;
  
  padding: 14px;
  
  background: var(--accent);
  
  border: none;
  
  border-radius: 10px;
  
  color: white;
  
  font-size: 15px;
  
  font-weight: 600;
  
  font-family: 'Space Grotesk', sans-serif;
  
  cursor: pointer;
  
  margin-top: 8px;
  
  transition: all 0.2s;
