body { background: #0a0a0f; color: #fff; font-family: 'Helvetica Neue', Arial, sans-serif; direction: rtl; }

nav { display: flex; align-items: center; justify-content: space-between; padding: 18px 48px; border-bottom: 1px solid #1a1a2a; background: #0a0a0f; }

.hero { display: flex; align-items: center; justify-content: space-between; gap: 48px; padding: 80px 48px 60px; min-height: calc(100vh - 65px); max-width: 1280px; margin: 0 auto; }

.hero-right { flex: 1; max-width: 620px; position: relative; }

.chart-dates { position: absolute; bottom: 8px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 16px; font-size: 10px; color: #444; direction: ltr; }
.chart-prices-axis { position: absolute; top: 0; bottom: 30px; left: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 8px; font-size: 10px; color: #444; direction: ltr; }

.stats-bar { background: #0b0b18; border-top: 1px solid #1a1a2a; border-bottom: 1px solid #1a1a2a; padding: 22px 48px; display: flex; align-items: center; justify-content: center; gap: 0; flex-wrap: wrap; }

.stat-icon { font-size: 20px; }
.stat-text strong { display: block; font-size: 15px; color: #fff; font-weight: 700; text-align: right; }
.stat-text span { font-size: 11px; color: #445566; text-transform: uppercase; letter-spacing: 1px; display: block; text-align: right; }
