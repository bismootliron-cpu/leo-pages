<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abundance for All — TradingView Indicator</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0a0a0a;
    --accent: #f5a623;
    --accent-dark: #c47f0f;
    --white: #ffffff;
    --gray: #aaaaaa;
    --card-bg: #111111;
    --border: #222222;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* ── NAV ── */
  nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 48px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .nav-logo {
    font-size: 18px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.5px;
    text-decoration: none;
  }
  .nav-cta {
    background: var(--accent);
    color: #000;
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    text-decoration: none;
    transition: background 0.2s;
  }
  .nav-cta:hover { background: var(--accent-dark); }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 80px 24px;
    background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(245,166,35,0.08) 0%, transparent 70%);
  }
  .hero-badge {
    display: inline-block;
    background: rgba(245,166,35,0.12);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 18px;
    border-radius: 40px;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 32px;
  }
  .hero h1 {
    font-size: clamp(36px, 6vw, 72px);
    font-weight: 900;
    line-height: 1.1;
    letter-spacing: -1.5px;
    color: var(--white);
    max-width: 820px;
    margin-bottom: 24px;
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    font-size: clamp(16px, 2vw, 20px);
    color: var(--gray);
    line-height: 1.7;
    max-width: 560px;
    margin-bottom: 44px;
  }
  .btn-primary {
    display: inline-block;
    background: var(--accent);
    color: #000;
    padding: 18px 40px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 16px;
    text-decoration: none;
    transition: background 0.2s, transform 0.15s;
    box-shadow: 0 8px 32px rgba(245,166,35,0.3);
  }
  .btn-primary:hover { background: var(--accent-dark); transform: translateY(-2px); }
  .hero-note {
    margin-top: 16px;
    font-size: 13px;
    color: #555;
  }

  /* ── DIVIDER ── */
  .divider {
    width: 60px;
    height: 3px;
    background: var(--accent);
    margin: 0 auto 60px;
    border-radius: 2px;
  }

  /* ── FEATURES ── */
  .features {
    padding: 100px 48px;
    max-width: 1200px;
    margin: 0 auto;
  }
  .section-label {
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
  }
  .section-title {
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 800;
    color: var(--white);
    text-align: center;
    margin-bottom: 16px;
    letter-spacing: -0.5px;
  }
  .section-sub {
    font-size: 16px;
    color: #666;
    text-align: center;
    margin-bottom: 60px;
  }
  .features-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
  }
  .feature-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 32px;
    text-align: center;
    transition: border-color 0.3s, transform 0.2s;
    position: relative;
    overflow: hidden;
  }
  .feature-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .feature-card:hover { border-color: var(--accent); transform: translateY(-4px); }
  .feature-card:hover::before { opacity: 1; }
  .feature-emoji {
    font-size: 44px;
    margin-bottom: 20px;
    display: block;
  }
  .feature-card h3 {
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .feature-card p {
    font-size: 15px;
    color: #888;
    line-height: 1.65;
  }

  /* ── PRICING ── */
  .pricing {
    padding: 100px 24px;
    background: linear-gradient(180deg, var(--bg) 0%, #0e0e0e 100%);
  }
  .pricing-inner {
    max-width: 480px;
    margin: 0 auto;
    text-align: center;
  }
  .pricing-card {
    background: var(--card-bg);
    border: 1px solid #2a2a2a;
    border-radius: 24px;
    padding: 52px 44px;
    position: relative;
    box-shadow: 0 0 80px rgba(245,166,35,0.08);
    margin-top: 48px;
  }
  .pricing-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 24px;
    padding: 1.5px;
    background: linear-gradient(135deg, var(--accent) 0%, transparent 50%, var(--accent) 100%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
  }
  .plan-label {
    display: inline-block;
    background: rgba(245,166,35,0.12);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 5px 16px;
    border-radius: 40px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 700;
    margin-bottom: 28px;
  }
  .price-display {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 4px;
    margin-bottom: 6px;
  }
  .price-dollar {
    font-size: 32px;
    font-weight: 800;
    color: var(--accent);
    margin-top: 12px;
  }
  .price-amount {
    font-size: 84px;
    font-weight: 900;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -3px;
  }
  .price-per {
    font-size: 20px;
    color: #444;
    align-self: flex-end;
    padding-bottom: 10px;
  }
  .price-period {
    font-size: 14px;
    color: #555;
    margin-bottom: 8px;
  }
  .price-then {
    font-size: 15px;
    color: #666;
    margin-bottom: 32px;
  }
  .price-then strong { color: #999; }
  .pricing-feature-list {
    list-style: none;
    margin-bottom: 36px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }
  .pricing-feature-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 15px;
    color: #ccc;
  }
  .check {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    background: rgba(245,166,35,0.15);
    border: 1px solid var(--accent);
    border-radius: 50%;
    color: var(--accent);
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .btn-pricing {
    display: block;
    width: 100%;
    background: var(--accent);
    color: #000;
    padding: 18px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 16px;
    text-decoration: none;
    transition: background 0.2s, transform 0.15s;
