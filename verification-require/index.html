<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watcher-Agent — אימות נדרש</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #08080f;
  --surface: #0e0e1a;
  --border: #1a1a2e;
  --accent: #6c63ff;
  --cyan: #00e5cc;
  --amber: #ffb020;
  --danger: #ff4d6d;
  --text: #e8e8f5;
  --muted: #7a7a9a;
  --card: #111120;
  --green: #00c97a;
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 32px 20px;
}

.page-wrap {
  max-width: 860px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

/* ── HEADER ── */
.page-header {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tag-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 20px;
  letter-spacing: 0.5px;
}

.tag.danger { background: rgba(255,77,109,0.15); color: var(--danger); border: 1px solid rgba(255,77,109,0.3); }
.tag.amber { background: rgba(255,176,32,0.12); color: var(--amber); border: 1px solid rgba(255,176,32,0.25); }
.tag.muted { background: rgba(90,90,122,0.15); color: var(--muted); border: 1px solid rgba(90,90,122,0.25); }

.page-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.page-title span { color: var(--danger); }

.page-sub {
  font-size: 13px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  line-height: 1.5;
}

/* ── ALERT BANNER ── */
.alert-banner {
  background: rgba(255,77,109,0.08);
  border: 1px solid rgba(255,77,109,0.35);
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
}

.alert-icon {
  font-size: 22px;
  flex-shrink: 0;
  margin-top: 1px;
}

.alert-text-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--danger);
  margin-bottom: 5px;
}

.alert-text-body {
  font-size: 12px;
  color: #ff8fa0;
  line-height: 1.6;
}

/* ── SECTION CARDS ── */
.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.section-card.proof1 { border-color: rgba(108,99,255,0.3); }
.section-card.proof2 { border-color: rgba(0,229,204,0.25); }
.section-card.clarify { border-color: rgba(255,176,32,0.3); }

.card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
}

.card-header.proof1 { background: rgba(108,99,255,0.06); }
.card-header.proof2 { background: rgba(0,229,204,0.04); }
.card-header.clarify { background: rgba(255,176,32,0.05); }

.card-num {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  flex-shrink: 0;
}

.card-num.p1 { background: rgba(108,99,255,0.2); color: var(--accent); }
.card-num.p2 { background: rgba(0,229,204,0.15); color: var(--cyan); }
.card-num.p3 { background: rgba(255,176,32,0.15); color: var(--amber); }

.card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.card-subtitle {
  font-size: 11px;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  margin-top: 2px;
}

.card-body {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* ── CODE BLOCKS ── */
.code-block-wrap {
  position: relative;
}

.code-label {
  font-size: 9px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  margin-bottom: 6px;
}

.code-block {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: #c8c8e8;
  overflow-x: auto;
  white-space: pre;
  line-height: 1.65;
  position: relative;
}

.code-block .kw { color: var(--accent); }
.code-block .str { color: var(--cyan); }
.code-block .num { color: var(--amber); }
.code-block .comment { color: var(--muted); }
.code-block .key { color: #a0d0ff; }
.code-block .url { color: var(--cyan); text-decoration: underline; }
.code-block .ok { color: var(--green); }
.code-block .err { color: var(--danger); }

.copy-btn {
  position: absolute;
  top: 10px;
  left: 10px;
  padding: 4px 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  color: var(--muted);
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
  cursor: pointer;
  transition: all 0.15s;
}

.copy-btn:hover { border-color: var(--accent); color: var(--accent); }

/* ── STATUS TABLE ── */
.status-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
}

.status-table th {
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  font-weight: 400;
}

.status-table td {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(26,26,46,0.6);
  font-family: 'JetBrains Mono', monospace;
  color: var(--text);
  vertical-align: top;
}

.status-table tr:last-child td { border-bottom: none; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 9px;
  border-radius: 10px;
  font-size: 10px;
  font-family: 'JetBrains Mono', monospace;
}

.badge.missing { background: rgba(255,77,109,0.12); color: var(--danger); border: 1px solid rgba(255,77,109,0.25); }
.badge.required { background: rgba(255,176,32,0.1); color: var(--amber); border: 1px solid rgba(255,176,32,0.2); }
.badge.ok { background: rgba(0,201,122,0.1); color: var(--green); border: 1px solid rgba(0,201,122,0.2); }

/* ── CLARIFICATION ITEMS ── */
.clarify-item {
  display: flex;
  gap: 12px;
  padding: 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.clarify-bullet {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: rgba(255,176,32,0.12);
  border: 1px solid rgba(255,176,32,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  flex-shrink: 0;
  margin-top: 1px;
}

.clarify-title {
  font-size: 12px;
  font-weight: 600;
  color: var(--amber);
  margin-bottom: 5px;
}

.clarify-body {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.6;
  font-family: 'JetBrains Mono', monospace;
}

.clarify-body strong { color: var(--text); font-weight: 500; }

/* ── SQL BLOCK ── */
.sql-block {
  background: var(--bg);
  border: 1px solid rgba(0,229,204,0.2);
  border
