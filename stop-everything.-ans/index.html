<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abundance for All — סחר רק כשהוא מאושר</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #0a0a0f;
  color: #ffffff;
  font-family: 'Segoe UI', Arial, sans-serif;
  direction: rtl;
  min-height: 100vh;
}
a { color: #00e5a0; text-decoration: none; }
a:hover { text-decoration: underline; }

/* NAV */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 48px;
  border-bottom: 1px solid #1a1a2e;
  background: #0a0a0f;
}
.nav-logo {
  font-size: 1.3rem;
  font-weight: 700;
  color: #00e5a0;
  letter-spacing: 1px;
}
.nav-cta {
  background: #00e5a0;
  color: #0a0a0f;
  padding: 10px 24px;
  border-radius: 6px;
  font-weight: 700;
  font-size: 0.95rem;
  text-decoration: none;
  transition: opacity 0.2s;
}
.nav-cta:hover { opacity: 0.85; text-decoration: none; }

/* HERO */
.hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  align-items: center;
  padding: 72px 48px 64px 48px;
  max-width: 1200px;
  margin: 0 auto;
}
.hero-left h1 {
  font-size: 3rem;
  font-weight: 900;
  line-height: 1.15;
  color: #ffffff;
  margin-bottom: 20px;
}
.hero-left h1 span { color: #00e5a0; }
.hero-left .subtitle {
  font-size: 1.1rem;
  color: #b0b8c8;
  line-height: 1.7;
  margin-bottom: 32px;
  max-width: 480px;
}
.bullets { list-style: none; margin-bottom: 36px; }
.bullets li {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
  font-size: 1rem;
  color: #d0d8e8;
  line-height: 1.5;
}
.bullets li .icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }
.bullets li strong { color: #ffffff; }

.hero-cta {
  display: inline-block;
  background: #00e5a0;
  color: #0a0a0f;
  padding: 14px 32px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 1.1rem;
  text-decoration: none;
  transition: opacity 0.2s, transform 0.2s;
}
.hero-cta:hover { opacity: 0.88; transform: translateY(-2px); text-decoration: none; }

/* CHART CARD */
.chart-card {
  background: #111118;
  border: 1px solid #1e1e2e;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 8px 40px rgba(0,0,0,0.6);
}
.chart-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 18px;
  border-bottom: 1px solid #1e1e2e;
  background: #13131c;
}
.chart-ticker { font-size: 1rem; font-weight: 700; color: #ffffff; }
.chart-ticker span { color: #8892a4; font-size: 0.85rem; font-weight: 400; margin-right: 8px; }
.chart-price { text-align: left; }
.chart-price .price { font-size: 1.15rem; font-weight: 700; color: #ffffff; }
.chart-price .change { font-size: 0.85rem; color: #ff4d6d; }

/* SVG Chart Area */
.chart-body { position: relative; background: #0d0d14; }
.chart-body svg { display: block; width: 100%; }

/* Overlay badges */
.chart-badges {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
}
.badge {
  position: absolute;
  font-size: 0.7rem;
  font-weight: 700;
  padding: 4px 9px;
  border-radius: 4px;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.badge-short { background: #ff4d6d; color: #fff; top: 18%; left: 12%; }
.badge-long { background: #00e5a0; color: #0a0a0f; top: 55%; left: 30%; }
.badge-early { background: #2a2a3e; color: #ff9f43; border: 1px solid #ff9f43; top: 30%; left: 50%; font-size: 0.65rem; }
.badge-target { background: #00e5a0; color: #0a0a0f; bottom: 18%; left: 62%; }

.chart-footer {
  display: flex;
  justify-content: space-between;
  padding: 8px 18px;
  background: #13131c;
  border-top: 1px solid #1e1e2e;
  font-size: 0.75rem;
  color: #4a5568;
}

/* STATS BAR */
.stats-bar {
  background: #0f0f1a;
  border-top: 1px solid #1a1a2e;
  border-bottom: 1px solid #1a1a2e;
  padding: 22px 48px;
}
.stats-inner {
  display: flex;
  justify-content: space-around;
  align-items: center;
  max-width: 1100px;
  margin: 0 auto;
  flex-wrap: wrap;
  gap: 16px;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.95rem;
  color: #b0b8c8;
}
.stat-item .stat-icon { font-size: 1.3rem; }
.stat-item strong { color: #ffffff; }

/* PRICING */
.pricing-section {
  padding: 80px 48px;
  text-align: center;
}
.pricing-section h2 {
  font-size: 2rem;
  font-weight: 800;
  color: #ffffff;
  margin-bottom: 10px;
}
.pricing-section .section-sub {
  color: #8892a4;
  font-size: 1rem;
  margin-bottom: 40px;
}
.pricing-card {
  display: inline-block;
  background: #111118;
  border: 1.5px solid #00e5a0;
  border-radius: 16px;
  padding: 40px 48px;
  max-width: 420px;
  width: 100%;
  text-align: center;
  box-shadow: 0 0 40px rgba(0,229,160,0.08);
}
.pricing-badge {
  display: inline-block;
  background: #00e5a0;
  color: #0a0a0f;
  font-size: 0.75rem;
  font-weight: 800;
  padding: 4px 14px;
  border-radius: 20px;
  margin-bottom: 18px;
  letter-spacing: 1px;
}
.pricing-price {
  font-size: 3rem;
  font-weight: 900;
  color: #ffffff;
  margin-bottom: 4px;
}
.pricing-price sub { font-size: 1rem; font-weight: 600; color: #8892a4; }
.pricing-after {
  font-size: 0.88rem;
  color: #8892a4;
  margin-bottom: 28px;
}
.pricing-features { list-style: none; margin-bottom: 28px; text-align: right; }
.pricing-features li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid #1a1a2e;
  font-size: 0.97rem;
  color: #d0d8e8;
}
.pricing-features li:last-child { border-bottom: none; }
.pricing-features .check { color: #00e5a0; font-size: 1.1rem; flex-shrink: 0; }
.pricing-btn {
  display: block;
  width: 100%;
  background: #00e5a0;
  color: #0a0a0f;
  padding: 15px 0;
  border-radius: 8px;
  font-size: 1.1rem;
  font-weight: 800;
  text-decoration: none;
  margin-bottom: 14px;
  transition: opacity 0.2s, transform 0.2s;
}
.pricing-btn:hover { opacity: 0.88; transform: translateY(-2px); text-decoration: none; }
.pricing-trial { font-size: 0.9rem; color: #8892a4; margin-bottom: 6px; }
.pricing-cancel { font-size: 0.82rem; color: #4a5568; }

/* FOOTER */
footer {
  background: #08080c;
  border-top: 1px solid #1a1a2e;
  padding: 28px 48px;
  text-align: center;
  color: #4a5568;
  font-size: 0.85rem;
}
footer a { color: #00e5a0; }

/* RESPONSIVE */
@media (max-width: 900px) {
  .hero {
    grid-template-columns: 1fr;
    padding: 48px 24px;
  }
  .hero-left h1 { font-size: 2rem; }
  nav { padding: 14px 24px; }
  .stats-inner { flex-direction: column; align-items: flex-start; gap: 14px; }
  .pricing-section { padding: 56px 24px; }
  .pricing-card { padding: 32px 24px; }
}
</style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="nav-logo">Abundance for All</div>
