<title>Singularity Indicator — TradingView Indicator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #0a0a0a; color: #ffffff; font-family: 'Helvetica Neue', Arial, sans-serif; }
.hero { padding: 48px 20px 32px; text-align: center; background: radial-gradient(ellipse at top, #1a1200 0%, #0a0a0a 60%); }
.badge { display: inline-block; background: rgba(212,175,55,0.15); border: 1px solid #d4af37; color: #d4af37; padding: 6px 16px; border-radius: 20px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 22px; }
h1 { font-size: clamp(30px, 7vw, 54px); font-weight: 700; line-height: 1.15; margin-bottom: 16px; color: #ffffff; }
h1 .gold { color: #d4af37; }
.subtitle { font-size: 16px; color: #a8a8a8; max-width: 480px; margin: 0 auto 36px; line-height: 1.6; }

/* Chart panel */
.chart-wrap { max-width: 640px; margin: 0 auto 32px; background: #10151f; border: 1px solid #232a38; border-radius: 14px; padding: 16px; }
.chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; color: #8a93a3; }
.chart-header .name { color: #fff; font-weight: 600; font-size: 13px; }
.chart-header .change { color: #2ecc71; font-weight: 600; }
svg { width: 100%; height: auto; display: block; }
.chart-caption { font-size: 10px; color: #5a5a5a; text-align: center; margin-top: 8px; }

/* Feature list */
.features { max-width: 640px; margin: 0 auto 36px; padding: 0 12px; }
.feature { display: flex; align-items: flex-start; gap: 16px; text-align: left; padding: 16px 0; border-bottom: 1px solid #1a1a1a; }
.feature:last-child { border-bottom: none; }
.feature-icon { width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; background: rgba(212,175,55,0.12); border: 1px solid rgba(212,175,55,0.3); display: flex; align-items: center; justify-content: center; font-size: 18px; }
.feature-title { font-size: 14px; font-weight: 700; color: #d4af37; letter-spacing: 0.5px; margin-bottom: 4px; }
.feature-desc { font-size: 13px; color: #9a9a9a; line-height: 1.5; }

/* Stats row */
.stats { max-width: 720px; margin: 0 auto 36px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 0 12px; }
.stat { flex: 1 1 140px; background: #111; border: 1px solid #222; border-radius: 12px; padding: 18px 12px; text-align: center; }
.stat-icon { font-size: 20px; margin-bottom: 8px; }
.stat-label { font-size: 11px; color: #e0e0e0; font-weight: 600; }
.stat-sub { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

/* Pricing */
.pricing { max-width: 420px; margin: 0 auto 36px; padding: 0 20px; }
.price-card { background: #111; border: 1px solid #d4af37; border-radius: 16px; padding: 32px 24px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.price-eyebrow { font-size: 11px; color: #999; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 6px; }
.price-amount { font-size: 42px; font-weight: 700; color: #d4af37; }
.price-amount span { font-size: 15px; color: #999; font-weight: 400; }
.price-note { font-size: 12px; color: #999; margin-top: 4px; margin-bottom: 18px; }
.price-features { list-style: none; display: inline-block; text-align: left; margin-bottom: 24px; }
.price-features li { font-size: 13px; color: #ccc; padding: 4px 0; }
.price-features li:before { content: "✓ "; color: #d4af37; }
.price-cta-label { font-size: 14px; color: #eee; margin-bottom: 14px; }
.btn { display: inline-block; padding: 14px 28px; background: #d4af37; color: #000; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 15px; }

/* Telegram */
.telegram-wrap { max-width: 640px; margin: 0 auto 40px; padding: 0 12px; text-align: center; }
.telegram-btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 30px; background: #229ED9; color: white; border-radius: 10px; text-decoration: none; font-weight: 700; font-size: 14px; }

/* Footer */
.footer-notes { max-width: 720px; margin: 0 auto; padding: 24px 20px 40px; display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; text-align: center; }
.footer-note { flex: 1 1 160px; font-size: 11px; color: #777; }
.footer-note strong { display: block; color: #ccc; font-size: 12px; margin-bottom: 3px; }
.footer-links { text-align: center; padding: 0 20px 30px; }
.footer-links a { color: #666; font-size: 11px; text-decoration: underline; }
.disclaimer-box { max-width: 640px; margin: 0 auto 30px; padding: 16px 20px; background: #0d0d0d; border: 1px solid #1e1e1e; border-radius: 10px; }
.disclaimer-box p { font-size: 11px; color: #777; line-height: 1.6; }
</style>
